<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 1</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <h1>Ejercicio 1 - Promedio de Notas</h1>

    <form method="POST">
        <label>Nota 1:</label>
        <input type="number" name="nota1" min="10" max="70" required>
        <br><br>

        <label>Nota 2:</label>
        <input type="number" name="nota2" min="10" max="70" required>
        <br><br>

        <label>Nota 3:</label>
        <input type="number" name="nota3" min="10" max="70" required>
        <br><br>

        <label>Asistencia (%):</label>
        <input type="number" name="asistencia" min="0" max="100" required>
        <br><br>

        <button type="submit">Calcular</button>
    </form>

    {% if promedio is not none %}
        <h2>Resultado</h2>
        <p>Promedio: {{ promedio }}</p>
        <p>Estado: {{ resultado }}</p>
    {% endif %}

    <br>
    <a href="{{ url_for('inicio') }}">Volver al menú</a>

</body>
</html>
